name: devmonitor
title: DevMonitor
base: core24
version: "0.1.0"
summary: Linux developer system monitor and environment doctor
description: |
  DevMonitor is a lightweight desktop app for Linux developers.

  It watches CPU, memory, ports, and developer activity; helps fix common
  Node/Git/Docker issues; and keeps running in the system tray when you
  close the window. After install it can start automatically on login so
  monitoring continues across restarts and power cycles.

  Features:
    - Live CPU / memory / process / port monitoring
    - Activity tracker (focus, idle, lock, boot, sleep)
    - Node, Git, Docker, and toolchain doctor with one-click fixes
    - Close to tray — keeps monitoring in the background

  Classic confinement is required so DevMonitor can observe system
  processes, ports, and journals like a normal desktop system tool.

website: https://github.com/sanjayviswanath2/DevMonitor
source-code: https://github.com/sanjayviswanath2/DevMonitor
issues: https://github.com/sanjayviswanath2/DevMonitor/issues
contact: https://github.com/sanjayviswanath2/DevMonitor/issues

grade: stable
confinement: classic
license: MIT
compression: lzo

platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]

# Keep library-lint noise down; classic ELF patching is handled via enable-patchelf.
lint:
  ignore:
    - library

apps:
  devmonitor:
    command: bin/devmonitor
    desktop: usr/share/applications/devmonitor.desktop
    common-id: com.devmonitor.desktop
    environment:
      # Classic desktop runtime: prefer snap-shipped libs, then base.
      LD_LIBRARY_PATH: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR:$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/webkit2gtk-4.1:$SNAP/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}
      GTK_PATH: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/gtk-3.0
      GDK_PIXBUF_MODULEDIR: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/gdk-pixbuf-2.0/2.10.0/loaders
      GDK_PIXBUF_MODULE_FILE: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/gdk-pixbuf-2.0/2.10.0/loaders.cache
      GI_TYPELIB_PATH: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/girepository-1.0
      GIO_MODULE_DIR: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/gio/modules
      XDG_DATA_DIRS: $SNAP/usr/share${XDG_DATA_DIRS:+:$XDG_DATA_DIRS}
      FONTCONFIG_PATH: $SNAP/etc/fonts
      FONTCONFIG_FILE: $SNAP/etc/fonts/fonts.conf
      GST_PLUGIN_PATH: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/gstreamer-1.0
      GST_PLUGIN_SYSTEM_PATH: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/gstreamer-1.0

parts:
  # Pre-built Tauri release binary. scripts/publish-snap.sh prepares snap/local/payload.
  # Classic desktop snaps must ship their runtime stack and patchelf ELF files so
  # interpreter/RPATH point into the snap or core24 base, not the build host.
  devmonitor:
    plugin: dump
    source: snap/local/payload
    source-type: local
    build-attributes:
      - enable-patchelf
    organize:
      devmonitor: bin/devmonitor
      "devmonitor.desktop": usr/share/applications/devmonitor.desktop
      "icons/32x32.png": usr/share/icons/hicolor/32x32/apps/devmonitor.png
      "icons/128x128.png": usr/share/icons/hicolor/128x128/apps/devmonitor.png
      "metainfo.xml": usr/share/metainfo/com.devmonitor.desktop.metainfo.xml
    stage-packages:
      # Core Tauri / WebKitGTK desktop stack
      - libwebkit2gtk-4.1-0
      - libjavascriptcoregtk-4.1-0
      - libgtk-3-0t64
      - libgdk-pixbuf-2.0-0
      - libsoup-3.0-0
      - libglib2.0-0t64
      - libpango-1.0-0
      - libcairo2
      - libharfbuzz0b
      - libayatana-appindicator3-1
      - libcanberra-gtk3-module
      - libcanberra0t64
      - libglu1-mesa
      # Image loaders / icons / mime (GTK desktop apps need these at runtime)
      - librsvg2-common
      - shared-mime-info
      - adwaita-icon-theme
      - hicolor-icon-theme
      - fonts-dejavu-core
      - fontconfig-config
      # Media helpers used by WebKit
      - gstreamer1.0-plugins-base
      - gstreamer1.0-gl
      - libgstreamer1.0-0
      - libgstreamer-plugins-base1.0-0
      - libgstreamer-gl1.0-0
    override-prime: |
      craftctl default
      # Refresh pixbuf loader cache inside the snap so icons/images resolve.
      if [ -x "$CRAFT_PRIME/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/gdk-pixbuf-2.0/gdk-pixbuf-query-loaders" ]; then
        "$CRAFT_PRIME/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/gdk-pixbuf-2.0/gdk-pixbuf-query-loaders" \
          > "$CRAFT_PRIME/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/gdk-pixbuf-2.0/2.10.0/loaders.cache" || true
      elif command -v gdk-pixbuf-query-loaders >/dev/null 2>&1; then
        GDK_PIXBUF_MODULEDIR="$CRAFT_PRIME/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/gdk-pixbuf-2.0/2.10.0/loaders" \
          gdk-pixbuf-query-loaders \
          > "$CRAFT_PRIME/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/gdk-pixbuf-2.0/2.10.0/loaders.cache" || true
      fi

layout:
  /usr/lib/x86_64-linux-gnu/webkit2gtk-4.1:
    bind: $SNAP/usr/lib/x86_64-linux-gnu/webkit2gtk-4.1
  /usr/share/mime:
    bind: $SNAP/usr/share/mime
  /usr/share/icons:
    bind: $SNAP/usr/share/icons
