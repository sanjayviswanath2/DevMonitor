[package]
name = "devmonitor"
version = "0.1.0"
description = "DevMonitor — lightweight Linux developer system monitor"
authors = ["DevMonitor"]
edition = "2021"

[lib]
name = "devmonitor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.35"
regex = "1"
libc = "0.2"
walkdir = "2.5.0"
rfd = "0.17.2"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "6"

[features]
# Production embeds the built UI. `npm run tauri dev` disables this and uses Vite.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
